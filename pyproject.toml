[project]
name = "peri"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.36",
    "pydantic>=2.7",
    "httpx>=0.27",
    "hyperliquid-python-sdk>=0.24",
    "lighter-sdk>=1.1.2",
    "feedparser>=6.0.14",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "websockets>=17.1",
]

[project.scripts]
peri = "peri.app:run"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peri"]
