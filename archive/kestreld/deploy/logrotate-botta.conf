# logrotate config for botta's nohup-era logs (user-run, not /etc/logrotate.d).
#
# These files only grow while a process is launched with `nohup … >> file 2>&1`.
# Under the systemd units both daemons log to journald instead, so after cutover
# these stop growing and this config just ages out what is already on disk.
#
# Run it as the user (absolute paths — logrotate does not expand ~):
#   logrotate -s ~/.local/state/logrotate-botta.status \
#             ~/botta/kestreld/deploy/logrotate-botta.conf
# Wiring + install notes: kestreld/deploy/README.md

/home/esoteric/botta/kestreld/smoke.log
/home/esoteric/botta/tg_news_pipe.log {
    weekly
    rotate 4
    compress
    # The writer holds the fd open and appends by offset; renaming the file
    # would leave it writing to an unlinked inode. Copy-then-truncate keeps the
    # same inode, so a still-running nohup process keeps logging.
    copytruncate
    missingok
    notifempty
}
